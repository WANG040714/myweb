<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="WQQ 的课程表 - 每天打开查看今日课程">
<title>课程表 · WQQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --primary: #4A90D9;
        --primary-light: #7AB8EC;
        --primary-dark: #2F6FA8;
        --accent: #A8D4F5;
        --text: #17324F;
        --text-sec: #3D5A75;
        --text-light: #7A93AC;
        --glass-border: rgba(255,255,255,0.55);
        --glass-shadow: 0 8px 32px rgba(60,110,170,0.18);
        --glass-shadow-lg: 0 16px 48px rgba(60,110,170,0.25);
        --radius: 18px;
        --radius-lg: 26px;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        background: linear-gradient(165deg, #eaf2fb 0%, #dcebf8 45%, #cfe3f4 100%);
        padding-bottom: 60px;
    }

    /* 漂浮光斑 */
    .blob {
        position: fixed;
        z-index: -1;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.4;
        pointer-events: none;
    }
    .blob-1 { width: 380px; height: 380px; background: rgba(140,190,255,0.55); top: -80px; left: -60px; }
    .blob-2 { width: 300px; height: 300px; background: rgba(190,225,255,0.6); bottom: 8%; right: -60px; }
    .blob-3 { width: 260px; height: 260px; background: rgba(120,170,235,0.4); top: 45%; left: 60%; }

    .wrap { max-width: 980px; margin: 0 auto; padding: 30px 20px 0; }

    /* 顶部导航条 */
    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 26px;
    }
    .brand {
        font-size: 20px;
        font-weight: 800;
        color: var(--primary-dark);
        text-decoration: none;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .back-home {
        font-size: 13px;
        color: var(--primary-dark);
        text-decoration: none;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: 980px;
        background: rgba(255,255,255,0.5);
        border: 1px solid var(--glass-border);
        transition: all 0.2s;
    }
    .back-home:hover { background: rgba(255,255,255,0.75); }

    /* 头部 */
    header { text-align: center; margin-bottom: 28px; }
    h1 {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -1px;
        margin-bottom: 6px;
        background: linear-gradient(120deg, var(--primary-dark), var(--primary) 55%, var(--accent));
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sub { font-size: 13px; color: var(--text-sec); }

    /* 今日信息卡片 */
    .today-card {
        background: rgba(255,255,255,0.6);
        border: 1px solid rgba(255,255,255,0.85);
        border-radius: var(--radius-lg);
        padding: 26px 28px;
        box-shadow: var(--glass-shadow);
        margin-bottom: 22px;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 18px;
        justify-content: center;
    }
    .today-date { font-size: 22px; font-weight: 800; color: var(--text); }
    .today-week { font-size: 15px; font-weight: 600; color: var(--primary-dark); }
    .today-tag {
        font-size: 13px;
        padding: 4px 14px;
        border-radius: 980px;
        background: rgba(74,144,217,0.14);
        color: var(--primary-dark);
        font-weight: 600;
    }

    /* 切换标签 */
    .tabs {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-bottom: 22px;
    }
    .tab {
        padding: 9px 22px;
        border-radius: 980px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--glass-border);
        background: rgba(255,255,255,0.4);
        color: var(--text-sec);
        transition: all 0.2s;
        font-family: inherit;
    }
    .tab.active {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #FFF;
        border-color: transparent;
        box-shadow: 0 6px 18px rgba(47,111,168,0.35);
    }

    /* 日期切换导航 */
    .day-nav-wrap {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        justify-content: center;
    }
    .nav-arrow {
        flex-shrink: 0;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 1px solid var(--glass-border);
        background: rgba(255,255,255,0.55);
        color: var(--primary-dark);
        font-size: 26px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 20px;
        box-shadow: var(--glass-shadow);
        transition: all 0.2s;
        font-family: inherit;
        line-height: 1;
        user-select: none;
    }
    .nav-arrow:hover { background: rgba(255,255,255,0.85); transform: scale(1.06); }
    .nav-arrow:active { transform: scale(0.96); }
    .nav-body { flex: 1; min-width: 0; max-width: 620px; }
    .back-today {
        font-size: 13px;
        padding: 5px 14px;
        border-radius: 980px;
        border: 1px solid var(--glass-border);
        background: rgba(255,255,255,0.6);
        color: var(--primary-dark);
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.2s;
    }
    .back-today:hover { background: rgba(255,255,255,0.85); }

    /* 今日课程 */
    .day-view { display: none; }
    .day-view.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .course-card {
        background: rgba(255,255,255,0.6);
        border: 1px solid rgba(255,255,255,0.85);
        border-radius: var(--radius);
        padding: 18px 20px;
        box-shadow: var(--glass-shadow);
        margin-bottom: 12px;
        display: flex;
        gap: 10px;
        align-items: center;
        min-height: 80px;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .course-time {
        flex-shrink: 0;
        min-width: 92px;
        text-align: center;
        background: linear-gradient(135deg, rgba(122,184,236,0.4), rgba(74,144,217,0.3));
        border-radius: 12px;
        padding: 10px 12px;
        border: 1px solid rgba(255,255,255,0.6);
    }
    .course-period { font-size: 16px; font-weight: 800; color: var(--primary-dark); white-space: nowrap; line-height: 1.35; }
    .course-clock { font-size: 12px; color: var(--text-sec); margin-top: 2px; white-space: nowrap; line-height: 1.35; }
    .course-info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }
    .course-name { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 2px; line-height: 1.4; }
    .course-meta { font-size: 13px; color: var(--text-sec); line-height: 1.45; }
    .course-meta .dot { margin: 0 6px; color: var(--text-light); }

    .empty-today {
        text-align: center;
        padding: 60px 20px;
        background: rgba(255,255,255,0.5);
        border: 1px solid rgba(255,255,255,0.85);
        border-radius: var(--radius-lg);
        box-shadow: var(--glass-shadow);
    }
    .empty-today .emoji { font-size: 52px; margin-bottom: 12px; }
    .empty-today .msg { font-size: 18px; font-weight: 700; color: var(--text); }
    .empty-today .sub2 { font-size: 13px; color: var(--text-sec); margin-top: 6px; }

    /* 整周课表 */
    .week-view { display: none; }
    .week-view.active { display: block; animation: fadeIn 0.3s ease; }

    .week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
    .day-col {
        background: rgba(255,255,255,0.5);
        border: 1px solid rgba(255,255,255,0.85);
        border-radius: 14px;
        padding: 12px 10px;
        box-shadow: var(--glass-shadow);
    }
    .day-col.today { border: 2px solid var(--primary); background: rgba(255,255,255,0.7); }
    .day-col-head {
        text-align: center;
        font-weight: 700;
        font-size: 13px;
        color: var(--primary-dark);
        padding-bottom: 8px;
        margin-bottom: 8px;
        border-bottom: 1px solid rgba(255,255,255,0.6);
    }
    .day-col.today .day-col-head { color: var(--primary-dark); }
    .week-course {
        font-size: 12px;
        color: var(--text-sec);
        padding: 7px 8px;
        margin-bottom: 7px;
        background: rgba(74,144,217,0.08);
        border-radius: 8px;
        border-left: 3px solid var(--primary-light);
        line-height: 1.5;
    }
    .week-course .wc-name { font-weight: 700; color: var(--text); font-size: 12.5px; }
    .week-course .wc-meta { font-size: 11px; color: var(--text-light); margin-top: 2px; }

    .week-note {
        text-align: center;
        font-size: 12px;
        color: var(--text-light);
        margin-top: 18px;
    }

    footer {
        text-align: center;
        margin-top: 36px;
        color: var(--text-sec);
        font-size: 12px;
    }
    footer a { color: var(--primary-dark); text-decoration: none; font-weight: 600; }

    @media (max-width: 820px) {
        .week-grid { grid-template-columns: repeat(2, 1fr); }
        h1 { font-size: 25px; }
        .course-card { flex-direction: column; gap: 8px; padding: 14px 16px; min-height: 0; }
        .course-time { width: 100%; display: flex; justify-content: space-between; align-items: baseline; padding: 8px 12px; }
        .course-meta .room { display: block; margin-top: 3px; }
        .course-meta .dot { margin: 0 3px; }
    }
    @media (max-width: 460px) {
        .week-grid { grid-template-columns: 1fr; }
        .today-card { flex-direction: column; align-items: center; gap: 6px; padding: 14px 16px; }
        .nav-arrow { width: 38px; height: 38px; font-size: 22px; margin-top: 16px; }
        .day-nav-wrap { gap: 8px; }
    }
</style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="wrap">
        <div class="topbar">
            <a href="/" class="brand">📚 课程表</a>
            <a href="/" class="back-home">← 返回主页</a>
        </div>

        <header>
            <h1>我的课程表</h1>
            <div class="sub">安徽科技工程大学 2026 级研究生 · 机械 · 2026-2027 学年第一学期</div>
        </header>

        <div class="today-card">
            <div class="today-date" id="todayDate"></div>
            <div class="today-week" id="todayWeek"></div>
            <span class="today-tag" id="todayTag"></span>
            <button class="back-today" id="backToday" onclick="backToToday()" style="display:none">📍 回到今天</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('day')">📅 今日课程</button>
            <button class="tab" onclick="switchTab('week')">🗓️ 整周课表</button>
        </div>

        <!-- 今日课程视图 -->
        <div class="day-view active" id="view-day">
            <div class="day-nav-wrap">
                <button class="nav-arrow" onclick="shiftDay(-1)" title="前一天" aria-label="前一天">‹</button>
                <div class="nav-body" id="todayCourses"></div>
                <button class="nav-arrow" onclick="shiftDay(1)" title="后一天" aria-label="后一天">›</button>
            </div>
        </div>

        <!-- 整周课表视图 -->
        <div class="week-view" id="view-week">
            <div class="week-grid" id="weekGrid"></div>
            <div class="week-note">注：未特殊标注教室的课程均在学思5号楼505；综合能力提升班上课时间地点另行通知。</div>
        </div>

        <footer>
            <p>© 2026 <a href="/">WQQ</a> · 每天打开自动显示今日课程</p>
        </footer>
    </div>

<script>
// ============ 学期配置 ============
const SEMESTER_START = new Date(2026, 7, 31); // 2026-08-31（周一）为第一周

// ============ 节次时间表 ============
const PERIOD_TIME = {
    1: ['08:20','09:05'], 2: ['09:15','10:00'], 3: ['10:20','11:05'], 4: ['11:15','12:00'],
    5: ['13:30','14:15'], 6: ['14:25','15:10'], 7: ['15:30','16:15'], 8: ['16:25','17:10'],
    9: ['18:30','19:15'], 10: ['19:25','20:10'], 11: ['20:20','21:05']
};

// ============ 课程数据 ============
// day: 1=周一 ... 7=周日；weeks: 上课周次数组；s/e: 起始/结束节次
const COURSES = [
    // 周一
    { day: 1, name: '工程伦理', teacher: '马万征', weeks: [2,3,4,5,7,8,9,12], s: 3, e: 4 },
    { day: 1, name: '产品设计与开发创新实践', teacher: '李同杰、郑伟', weeks: [2,3,4,5], s: 7, e: 8 },
    { day: 1, name: '现代农业装备设计与优化（双语）', teacher: '张新伟、余振', weeks: [2], s: 9, e: 10 },
    { day: 1, name: '现代农业装备设计与优化（双语）', teacher: '张新伟、余振', weeks: [3,4], s: 9, e: 11 },
    // 周二
    { day: 2, name: '新时代中国特色社会主义理论与实践', teacher: '张帆', weeks: [2,3,4,5,7,8,9,10,11,12], s: 2, e: 4 },
    { day: 2, name: '新时代中国特色社会主义理论与实践', teacher: '张帆', weeks: [13], s: 3, e: 4 },
    { day: 2, name: '研究生英语', teacher: '张瑞娥', weeks: [2,3,4,5,7,8,9,10,11,12], s: 5, e: 7 },
    { day: 2, name: '研究生英语', teacher: '张瑞娥', weeks: [13], s: 5, e: 6 },
    { day: 2, name: '智能农业装备及多学科创新前沿进展', teacher: '徐必勇、曾其良', weeks: [2,3,4,5,7,8,9], s: 9, e: 11 },
    // 周三
    { day: 3, name: '高等工程数学', teacher: '司志远', weeks: [12,13,14,15], s: 2, e: 4 },
    { day: 3, name: '高等农业机械学', teacher: '易克传、王晴晴', weeks: [2,3,4,7], s: 9, e: 11 },
    // 周四
    { day: 4, name: '自然辩证法概论', teacher: '谢明星', weeks: [2,3,4,6], s: 2, e: 4 },
    { day: 4, name: '自然辩证法概论', teacher: '谢明星', weeks: [7,8], s: 3, e: 4 },
    { day: 4, name: '产品设计与开发创新实践', teacher: '李同杰、郑伟', weeks: [2,3,4,6], s: 5, e: 6 },
    { day: 4, name: '智能农业装备及多学科创新前沿进展', teacher: '徐必勇、曾其良', weeks: [2,3,6], s: 9, e: 11 },
    { day: 4, name: '智能农业装备及多学科创新前沿进展', teacher: '徐必勇、曾其良', weeks: [7], s: 9, e: 10 },
    // 周五
    { day: 5, name: '试验设计与统计', teacher: '张春燕', weeks: [7,8,9,10], s: 1, e: 4 },
    { day: 5, name: '高等工程数学', teacher: '司志远', weeks: [12,13,14,15], s: 2, e: 4 },
    { day: 5, name: '公共选修课', teacher: '综合能力提升班', weeks: [9,10,11,12,13,14,15,16], s: 5, e: 8 },
    { day: 5, name: '公共选修课', teacher: '', weeks: [9,10,11,12,13,14,15,16], s: 9, e: 10 },
    // 周六
    { day: 6, name: '高等农业机械学', teacher: '易克传、王晴晴', weeks: [2,3,6], s: 5, e: 8 },
    { day: 6, name: '论文写作与学术规范', teacher: '曹波', weeks: [6,7], s: 9, e: 11 },
    { day: 6, name: '论文写作与学术规范', teacher: '曹波', weeks: [8], s: 9, e: 10 },
    // 周日
    { day: 7, name: '农机装备传感与检测技术', teacher: '刘春辉、丁奇安', weeks: [2,3,6,7,8,9,10,11], s: 5, e: 8 },
];

const WEEK_NAMES = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

// ============ 工具函数 ============
function getWeekNumber(date) {
    const diff = date.getTime() - SEMESTER_START.getTime();
    const dayDiff = Math.floor(diff / (24 * 3600 * 1000));
    return Math.floor(dayDiff / 7) + 1;
}

function getTodayDayOfWeek(date) {
    // JS getDay: 0=周日 1=周一 ... 6=周六；映射到 1=周一 ... 7=周日
    const d = date.getDay();
    return d === 0 ? 7 : d;
}

function formatWeeks(weeks) {
    if (!weeks || !weeks.length) return '';
    const sorted = [...weeks].sort((a, b) => a - b);
    const ranges = [];
    let start = sorted[0], prev = sorted[0];
    for (let i = 1; i < sorted.length; i++) {
        if (sorted[i] === prev + 1) { prev = sorted[i]; continue; }
        ranges.push(start === prev ? `${start}` : `${start}-${prev}`);
        start = prev = sorted[i];
    }
    ranges.push(start === prev ? `${start}` : `${start}-${prev}`);
    return ranges.join(',');
}

function formatPeriod(s, e) {
    if (!PERIOD_TIME[s] || !PERIOD_TIME[e]) return '';
    return `${PERIOD_TIME[s][0]}-${PERIOD_TIME[e][1]}`;
}

function periodLabel(s, e) {
    return s === e ? `第${s}节` : `第${s}-${e}节`;
}

// ============ 日期切换 + 单日课程 ============
let viewDate = new Date(); // 当前查看的日期（默认今天）

function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() &&
           a.getMonth() === b.getMonth() &&
           a.getDate() === b.getDate();
}

function shiftDay(delta) {
    viewDate.setDate(viewDate.getDate() + delta);
    renderDay();
}

function backToToday() {
    viewDate = new Date();
    renderDay();
}

function renderDay() {
    const weekNum = getWeekNumber(viewDate);
    const dayOfWeek = getTodayDayOfWeek(viewDate);
    const isToday = isSameDay(viewDate, new Date());

    const dateStr = `${viewDate.getFullYear()}年${viewDate.getMonth() + 1}月${viewDate.getDate()}日`;
    document.getElementById('todayDate').textContent = dateStr + ' ' + WEEK_NAMES[dayOfWeek - 1];
    document.getElementById('todayWeek').textContent = '第 ' + weekNum + ' 周';
    document.getElementById('todayTag').textContent = isToday ? '今天' : '2026-2027 学年第一学期';
    document.getElementById('backToday').style.display = isToday ? 'none' : 'inline-block';

    const dayCourses = COURSES
        .filter(c => c.day === dayOfWeek && c.weeks.includes(weekNum))
        .sort((a, b) => a.s - b.s);

    const container = document.getElementById('todayCourses');

    if (dayCourses.length === 0) {
        container.innerHTML = `
            <div class="empty-today">
                <div class="emoji">🎉</div>
                <div class="msg">${isToday ? '今天没有课' : '这天没有课'}</div>
                <div class="sub2">${isToday ? '好好休息，或者自习一下 ~' : '放松一下，做点别的 ~'}</div>
            </div>`;
        return;
    }

    container.innerHTML = dayCourses.map(c => `
            <div class="course-card">
                <div class="course-time">
                    <div class="course-period">${periodLabel(c.s, c.e)}</div>
                    <div class="course-clock">${formatPeriod(c.s, c.e)}</div>
                </div>
                <div class="course-info">
                    <div class="course-name">${c.name}</div>
                    <div class="course-meta">${c.teacher ? '<span>' + c.teacher + '</span><span class="dot">·</span>' : ''}<span>第 ${formatWeeks(c.weeks)} 周</span><span class="room"><span class="dot">·</span>学思5号楼505</span></div>
                </div>
            </div>`).join('');
}

// ============ 整周课表 ============
function renderWeek() {
    const now = new Date();
    const todayDay = getTodayDayOfWeek(now);
    const grid = document.getElementById('weekGrid');

    grid.innerHTML = WEEK_NAMES.map((name, idx) => {
        const day = idx + 1;
        const dayCourses = COURSES
            .filter(c => c.day === day)
            .sort((a, b) => a.s - b.s);
        const isToday = day === todayDay;
        const items = dayCourses.map(c => {
            const teacherText = c.teacher ? `<div class="wc-meta">${c.teacher}</div>` : '';
            return `
                <div class="week-course">
                    <div class="wc-name">${c.name}</div>
                    <div class="wc-meta">第${formatWeeks(c.weeks)}周 · ${periodLabel(c.s, c.e)}</div>
                    ${teacherText}
                </div>`;
        }).join('');
        return `
            <div class="day-col${isToday ? ' today' : ''}">
                <div class="day-col-head">${name}${isToday ? ' ⭐' : ''}</div>
                ${items || '<div class="week-course" style="opacity:0.5">无课</div>'}
            </div>`;
    }).join('');
}

// ============ 切换标签 ============
function switchTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.day-view, .week-view').forEach(v => v.classList.remove('active'));
    if (name === 'day') {
        document.querySelector('.tab[onclick*="day"]').classList.add('active');
        document.getElementById('view-day').classList.add('active');
    } else {
        document.querySelector('.tab[onclick*="week"]').classList.add('active');
        document.getElementById('view-week').classList.add('active');
        renderWeek();
    }
}

// ============ 初始化 ============
renderDay();
renderWeek();
</script>
</body>
</html>
